teacher:
  model: google/gemma-4-26b-a4b-qat
  base_url: http://localhost:1234/v1
  temperature: 0.7
  max_tokens: 4096

student:
  model: google/gemma-4-26b-a4b-qat
  base_url: http://localhost:1234/v1
  temperature: 0.3
  max_tokens: 8192

dataset:
  name: contract-nli
  split: train
  max_samples: 50

clustering:
  eps: 0.5
  min_samples: 2
  embedding_model: all-MiniLM-L6-v2

conflict_resolution:
  max_iterations: 5
  convergence_threshold: 0.01
  sample_size: 20

wandb:
  project: prompt-level-distillation
  run_name: null
  entity: null

phases:
  extract: true
  cluster: true
  conflict: true
  evaluate: true

output_dir: output
