teacher:
  model: Qwen/Qwen3.6-35B-A3B-FP8
  base_url: http://127.0.0.1:18471/v1
  temperature: 0.7
  max_tokens: null   # server-side max: full remaining context per request
  concurrency: 16

student:
  model: Qwen/Qwen3.6-35B-A3B-FP8
  base_url: http://127.0.0.1:18471/v1
  temperature: 0.3
  max_tokens: null
  concurrency: 32

dataset:
  name: contract-nli
  split: train
  max_samples: null        # full train split (6,819)
  eval_split: test
  eval_max_samples: null   # full test split (1,991)
  # saved via save_to_disk at prep time; offline nodes can't resolve
  # data_dir datasets from the hub cache
  local_path: /home/sashraf/projects/prompt-distill/data/contract-nli

clustering:
  # kmeans, not dbscan: measured on the 6,819 extracted rules, DBSCAN
  # chains everything into one giant cluster at every workable eps.
  # k=17 matches the paper's cluster count for contract-nli.
  algorithm: kmeans
  n_clusters: 17
  embedding_model: all-MiniLM-L6-v2
  max_rules_per_synthesis: 150

conflict_resolution:
  max_iterations: 3
  convergence_threshold: 0.01
  sample_size: 20

wandb:
  project: prompt-level-distillation
  run_name: snellius-qwen36-35b-a3b-fp8
  entity: null

phases:
  extract: false   # phase 1 artifact from job 25547985 is in output_dir
  cluster: true
  conflict: true
  evaluate: true

output_dir: /home/sashraf/projects/prompt-distill/output
